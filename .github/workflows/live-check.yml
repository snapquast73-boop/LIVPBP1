name: Verify deployed site

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published:
    # Only after a successful GitHub Pages deployment, or when run by hand.
    if: github.event_name != 'deployment_status' || (github.event.deployment.environment == 'github-pages' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Every published file is served
        env:
          BASE: https://snapquast73-boop.github.io/LIVPBP1/
        run: |
          set -euo pipefail
          for file in index.html game.html reviews.html flagged.html 404.html \
                      assets/css/style.css assets/js/api.js assets/js/ui.js \
                      assets/js/reviews.js assets/js/reviews-feed.js \
                      assets/js/scoreboard.js assets/js/game.js assets/js/props.js \
                      assets/js/feed-log.js; do
            code=$(curl -sS -o "$RUNNER_TEMP/body" -w '%{http_code}' --retry 3 "$BASE$file")
            test "$code" = 200 || { echo "::error::$file -> HTTP $code"; exit 1; }
            test -s "$RUNNER_TEMP/body" || { echo "::error::$file is empty"; exit 1; }
          done
          echo "All 15 published files return HTTP 200 with a non-empty body."

      - name: The deployed pages load the restored client, not a removed one
        env:
          BASE: https://snapquast73-boop.github.io/LIVPBP1/
        run: |
          set -euo pipefail
          for page in index.html game.html reviews.html; do
            curl -fsS "$BASE$page" -o "$RUNNER_TEMP/$page"
            grep -q 'assets/css/style.css' "$RUNNER_TEMP/$page" || { echo "::error::$page lost its stylesheet"; exit 1; }
            grep -q 'assets/js/api.js' "$RUNNER_TEMP/$page" || { echo "::error::$page lost its client"; exit 1; }
            if grep -q 'assets/app.js' "$RUNNER_TEMP/$page"; then
              echo "::error::$page still loads the removed assets/app.js"; exit 1
            fi
          done
          curl -fsS "$BASE/flagged.html" | grep -q '<h1>Flagged for Review</h1>'
          echo "Deployed pages reference the restored client."

      - name: Deployed site against the official MLB payload
        env:
          BASE_URL: https://snapquast73-boop.github.io/LIVPBP1/
        run: node tests/live-e2e.mjs

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployed-site check"
            echo "Compared ${BASE_URL:-the public site} with:"
            echo "- https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=2024-10-30&hydrate=team,linescore,decisions,review"
            echo "- https://statsapi.mlb.com/api/v1.1/game/775296/feed/live"
          } >> "$GITHUB_STEP_SUMMARY"
