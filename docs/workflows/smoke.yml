# OPTIONAL template — copy to .github/workflows/smoke.yml to run the
# deterministic offline suite on push/PR plus an optional nightly MLB API shape check.
#
# Active repository workflows already live in `.github/workflows/`.
name: Optional Smoke Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  live-api-shape:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Verify official MLB gameStatus and schedule shapes
        run: |
          set -euo pipefail
          curl -fsS --retry 3 'https://statsapi.mlb.com/api/v1/gameStatus' -o /tmp/gameStatus.json
          curl -fsS --retry 3 'https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=2024-10-30&fields=dates,games,gamePk,status,statusCode,detailedState,abstractGameState' -o /tmp/schedule.json
          jq -e '([.[] | .statusCode] | index("IH") != null and index("MA") != null and index("MJ") != null and index("NH") != null and index("NJ") != null)' /tmp/gameStatus.json > /dev/null
          jq -e '(.dates | type == "array") and (.dates[0].games[0].gamePk == 775296)' /tmp/schedule.json > /dev/null
